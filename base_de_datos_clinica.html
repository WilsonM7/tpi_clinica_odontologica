
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const { svg } = await mermaid.render('erd-svg', `erDiagram
  usuarios {
    uuid id PK
    string nombre
    string email
    string rol
    uuid sucursal_id FK
    boolean activo
    timestamp created_at
  }
  sucursales {
    uuid id PK
    string nombre
    string direccion
    string ciudad
    boolean activa
  }
  pacientes {
    uuid id PK
    string apellido_nombre
    string dni
    date fecha_nacimiento
    string telefono
    string email
    string como_conocio
    uuid sucursal_id FK
    timestamp created_at
  }
  especialidades {
    uuid id PK
    string nombre
  }
  profesionales {
    uuid id PK
    uuid usuario_id FK
    string especialidad_principal
    string nombre_corto
  }
  tratamientos {
    uuid id PK
    uuid paciente_id FK
    uuid especialidad_id FK
    uuid profesional_id FK
    string tipo_material
    string tipo_tto
    string tipo_cont
    decimal entrega
    decimal cuota_base
    decimal aumento
    date fecha_inicio
    string estado
  }
  practicas {
    uuid id PK
    uuid especialidad_id FK
    string codigo
    string nombre
    decimal valor
    boolean cobra_descartable
    decimal multa
    string tipo_multa
  }
  turnos {
    uuid id PK
    uuid paciente_id FK
    uuid profesional_id FK
    uuid sucursal_id FK
    uuid practica_id FK
    timestamp fecha_hora
    string estado
    string notas
    boolean asistio
  }
  cobros {
    uuid id PK
    uuid paciente_id FK
    uuid turno_id FK
    uuid sucursal_id FK
    uuid usuario_id FK
    uuid practica_id FK
    date fecha
    decimal subtotal
    decimal multa
    decimal deuda_anterior
    decimal total
    string medio_pago
    decimal monto_pagado
    decimal diferencia
    decimal deuda_pagada
    int brackets
    int tubos
    int arcos
  }
  historial_deudas {
    uuid id PK
    uuid paciente_id FK
    uuid sucursal_id FK
    string mes_anio
    decimal saldo
    timestamp updated_at
  }
  historia_clinica {
    uuid id PK
    uuid paciente_id FK
    uuid profesional_id FK
    uuid turno_id FK
    date fecha
    string evolucion
    string observaciones
  }
  archivos_clinicos {
    uuid id PK
    uuid historia_clinica_id FK
    uuid paciente_id FK
    string tipo
    string url
    string nombre
    timestamp created_at
  }
  usuarios ||--o{ cobros : registra
  usuarios ||--|| profesionales : es
  sucursales ||--o{ usuarios : tiene
  sucursales ||--o{ turnos : agenda
  sucursales ||--o{ cobros : registra
  sucursales ||--o{ historial_deudas : acumula
  pacientes ||--o{ tratamientos : tiene
  pacientes ||--o{ turnos : agenda
  pacientes ||--o{ cobros : paga
  pacientes ||--o{ historial_deudas : debe
  pacientes ||--o{ historia_clinica : tiene
  especialidades ||--o{ tratamientos : clasifica
  especialidades ||--o{ practicas : agrupa
  profesionales ||--o{ turnos : atiende
  profesionales ||--o{ historia_clinica : registra
  practicas ||--o{ turnos : practica
  practicas ||--o{ cobros : cobra
  tratamientos ||--o{ cobros : genera
  turnos ||--o{ cobros : origina
  historia_clinica ||--o{ archivos_clinicos : contiene
`);
document.getElementById('erd').innerHTML = svg;
document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});
document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
